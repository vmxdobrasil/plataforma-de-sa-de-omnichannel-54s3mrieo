<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vmGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14805A" />
      <stop offset="100%" stop-color="#0B5239" />
    </linearGradient>
    <filter id="shadowMask" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Edge-to-edge background for maskable icons (no border-radius) -->
  <rect width="512" height="512" fill="url(#vmGradMask)" />
  
  <!-- Safe zone contained graphic (scale: 0.72) -->
  <g transform="translate(71.68, 71.68) scale(0.72)">
    <circle cx="256" cy="256" r="230" fill="none" stroke="#34D399" stroke-width="8" opacity="0.3" />
    
    <!-- Medical Cross -->
    <g transform="translate(256, 195)" filter="url(#shadowMask)">
      <rect x="-24" y="-90" width="48" height="180" rx="18" fill="#FFFFFF" />
      <rect x="-90" y="-24" width="180" height="48" rx="18" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="34" fill="#14805A" />
      <path d="M-19 0 L-9 0 L-3 -15 L4 17 L9 -5 L14 0 L19 0" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Typography -->
    <text x="256" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="72" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">V MED</text>
    <text x="256" y="438" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#A7F3D0" text-anchor="middle" letter-spacing="14">BRASIL</text>
  </g>
</svg>
