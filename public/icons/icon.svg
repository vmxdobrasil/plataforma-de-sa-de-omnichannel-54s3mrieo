<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14805A" />
      <stop offset="100%" stop-color="#0B5239" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with standard rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#vmGrad)" />
  
  <!-- Subtle accent circle -->
  <circle cx="256" cy="256" r="225" fill="none" stroke="#34D399" stroke-width="6" opacity="0.35" />
  
  <!-- Medical Cross with Shadow -->
  <g transform="translate(256, 195)" filter="url(#shadow)">
    <rect x="-22" y="-85" width="44" height="170" rx="16" fill="#FFFFFF" />
    <rect x="-85" y="-22" width="170" height="44" rx="16" fill="#FFFFFF" />
    <!-- Heart pulse central circle -->
    <circle cx="0" cy="0" r="32" fill="#14805A" />
    <!-- Pulse ECG line -->
    <path d="M-18 0 L-8 0 L-3 -14 L4 16 L9 -5 L14 0 L18 0" fill="none" stroke="#34D399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="256" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="70" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">V MED</text>
  <text x="256" y="435" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="26" fill="#A7F3D0" text-anchor="middle" letter-spacing="14">BRASIL</text>
</svg>
