<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem Conexão — V MED BRASIL</title>
    <meta name="theme-color" content="#14805A" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #064e3b 0%, #042f2e 100%);
        color: #f0fdf4;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(52, 211, 153, 0.25);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 24px;
        padding: 40px 28px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .logo-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(20, 128, 90, 0.35);
        border: 2px solid #34d399;
        border-radius: 20px;
      }
      .logo-icon svg {
        width: 44px;
        height: 44px;
        fill: none;
        stroke: #34d399;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        color: #ffffff;
      }
      .badge {
        display: inline-block;
        background: rgba(20, 128, 90, 0.4);
        color: #a7f3d0;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 12px;
        letter-spacing: 1.5px;
        margin-bottom: 16px;
      }
      p {
        color: #d1fae5;
        font-size: 15px;
        line-height: 1.55;
        margin-bottom: 28px;
      }
      .btn {
        background: #14805a;
        color: #ffffff;
        border: none;
        outline: none;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 14px;
        cursor: pointer;
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        box-shadow: 0 4px 14px rgba(20, 128, 90, 0.4);
      }
      .btn:hover {
        background: #0b5239;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .sos-note {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 13px;
        color: #93c5fd;
      }
      .sos-note a {
        color: #f87171;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <div class="badge">V MED BRASIL</div>
      <h1>Sem conexão com a internet</h1>
      <p>
        Não foi possível conectar aos serviços da V MED. Verifique sua rede Wi-Fi ou dados móveis
        para retomar o acesso aos seus agendamentos e prontuários.
      </p>

      <button class="btn" onclick="window.location.reload()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Tentar novamente
      </button>

      <div class="sos-note">
        Em caso de urgência médica com risco de vida, ligue imediatamente para o SAMU no
        <a href="tel:192">192</a> ou Bombeiros no <a href="tel:193">193</a>.
      </div>
    </div>
  </body>
</html>
